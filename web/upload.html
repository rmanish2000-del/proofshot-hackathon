<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src 'self'; img-src 'self' blob:; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>ProofShot: seller upload</title>
<style>
  :root { --ink: #1a1a1a; --muted: #5d6a79; --line: #e3e3e0; --ok: #1d6b3a; --okbg: #e6f4ea; --warn: #7a4b00; --warnbg: #fff4e0; --bad: #8a2c2c; --badbg: #fde8e8; --accent: #1f4e9e; }
  * { box-sizing: border-box; }
  body { font: 17px/1.5 system-ui, sans-serif; margin: 0; color: var(--ink); background: #fafaf8; }
  header { padding: 0.9rem 1rem; border-bottom: 1px solid var(--line); background: #fff; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
  header h1 { font-size: 1.1rem; margin: 0; }
  main { padding: 1rem; max-width: 36rem; margin: 0 auto; }
  p.lead { color: var(--muted); font-size: 0.95rem; margin: 0 0 1rem; }
  #mode { padding: 0.6rem 0.8rem; border-radius: 8px; font-size: 0.9rem; margin-bottom: 1rem; }
  #mode.fixture { background: var(--warnbg); color: var(--warn); }
  #mode.live { background: var(--okbg); color: var(--ok); }
  #mode.off { background: var(--badbg); color: var(--bad); }
  #mode:empty { display: none; }
  #mode details { margin-top: 0.4rem; } #mode summary { cursor: pointer; } #mode dl { margin: 0.3rem 0 0; font-size: 0.82rem; } #mode dt { font-weight: 600; } #mode dd { margin: 0 0 0.3rem; }
  label { display: block; font-weight: 600; margin: 0.9rem 0 0.3rem; }
  input[type=text] { width: 100%; font: inherit; padding: 0.7rem 0.8rem; border: 1px solid var(--line); border-radius: 8px; }
  .drop { border: 2px dashed #b9c2cc; border-radius: 12px; padding: 1.4rem 1rem; text-align: center; color: var(--muted); background: #fff; cursor: pointer; min-height: 7rem; display: flex; align-items: center; justify-content: center; }
  .drop.over { border-color: var(--accent); background: #eef3fb; }
  .drop input { display: none; }
  .thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-top: 0.6rem; }
  .thumbs figure { margin: 0; position: relative; }
  .thumbs img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 8px; background: #eee; }
  .thumbs figcaption { font-size: 0.75rem; color: var(--muted); overflow-wrap: anywhere; }
  .thumbs button { position: absolute; top: 0.25rem; right: 0.25rem; border: 0; border-radius: 999px; width: 1.7rem; height: 1.7rem; background: rgba(0,0,0,0.6); color: #fff; font: inherit; cursor: pointer; }
  button.primary { width: 100%; margin-top: 1rem; padding: 0.9rem; font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 10px; cursor: pointer; }
  button.primary:disabled { background: #9fb0c8; cursor: default; }
  button.lang { font: inherit; font-size: 0.9rem; padding: 0.35rem 0.7rem; border: 1px solid var(--line); border-radius: 999px; background: #fff; cursor: pointer; }
  .error { color: var(--bad); background: var(--badbg); padding: 0.6rem 0.8rem; border-radius: 8px; margin-top: 0.8rem; font-size: 0.9rem; }
  .error:empty { display: none; }
  ol.steps { list-style: none; padding: 0; margin: 1rem 0 0; background: #fff; border: 1px solid var(--line); border-radius: 12px; }
  ol.steps li { display: grid; grid-template-columns: 1.6rem 1fr; gap: 0.6rem; padding: 0.7rem 0.9rem; border-top: 1px solid var(--line); }
  ol.steps li:first-child { border-top: 0; }
  .dot { width: 1.3rem; height: 1.3rem; border-radius: 999px; background: #e3e3e0; margin-top: 0.15rem; display: inline-flex; align-items: center; justify-content: center; font-size: 0.75rem; color: #fff; }
  .pending .dot { background: #e3e3e0; } .running .dot { background: var(--accent); animation: pulse 1s infinite alternate; } .done .dot { background: var(--ok); } .done .dot::before { content: "✓"; } .failed .dot { background: var(--bad); } .failed .dot::before { content: "!"; } .skipped .dot { background: #b9c2cc; } .skipped .dot::before { content: "–"; }
  @keyframes pulse { from { opacity: 0.5; } to { opacity: 1; } }
  .step-name { font-weight: 600; } .step-state { color: var(--muted); font-size: 0.85rem; } .step-detail { color: var(--muted); font-size: 0.8rem; overflow-wrap: anywhere; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-top: 1rem; }
  .card img { display: block; width: 100%; max-height: 70vh; object-fit: contain; background: #eee; }
  .card .body { padding: 1rem; }
  .badge { display: inline-block; font-weight: 700; border-radius: 999px; padding: 0.3rem 0.8rem; font-size: 0.95rem; }
  .badge.RELEASE { background: var(--okbg); color: var(--ok); } .badge.REVIEW { background: var(--warnbg); color: var(--warn); } .badge.REFUSE { background: var(--badbg); color: var(--bad); }
  .tag { display: inline-block; font-size: 0.75rem; padding: 0.1rem 0.5rem; border-radius: 999px; background: var(--warnbg); color: var(--warn); margin-left: 0.4rem; }
  .card h2 { font-size: 1rem; margin: 0.9rem 0 0.3rem; }
  .card ul { margin: 0; padding-left: 1.2rem; font-size: 0.92rem; }
  .card .links { margin-top: 0.9rem; display: flex; flex-wrap: wrap; gap: 0.6rem 1rem; font-size: 0.95rem; }
  .card .hash { font-family: ui-monospace, monospace; font-size: 0.75rem; color: var(--muted); overflow-wrap: anywhere; margin-top: 0.6rem; }
  .published { margin-top: 0.8rem; padding: 0.6rem 0.8rem; background: var(--okbg); color: var(--ok); border-radius: 8px; font-size: 0.92rem; }
  .again { margin-top: 1rem; background: none; border: 0; color: var(--muted); font: inherit; text-decoration: underline; cursor: pointer; padding: 0; }
  footer { text-align: center; color: var(--muted); font-size: 0.8rem; padding: 2rem 1rem; }
  [hidden] { display: none !important; }
  /* NR5: three-step flow, photo guide, input vs result. */
  /* UX-EASY1: two steps, photos then result; no typing required. */
  .drop.big { min-height: 11rem; flex-direction: column; gap: 0.3rem; }
  .drop.big strong { font-size: 1.2rem; color: var(--ink); }
  button.sample { width: 100%; margin-top: 0.6rem; min-height: 44px; padding: 0.7rem; font: inherit; font-weight: 600; color: var(--accent); background: #fff; border: 1px solid var(--accent); border-radius: 10px; cursor: pointer; }
  button.sample:disabled { color: #9fb0c8; border-color: #9fb0c8; cursor: default; }
  .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.3rem; }
  .chip { border: 1px solid var(--line); border-radius: 10px; padding: 0.35rem 0.6rem; font-size: 0.85rem; background: #fff; max-width: 100%; }
  .chip b { margin-right: 0.3rem; } .chip .val { color: var(--muted); display: block; font-size: 0.78rem; overflow-wrap: anywhere; }
  .chip.match { border-color: var(--ok); } .chip.match b { color: var(--ok); }
  .chip.mismatch { border-color: var(--bad); background: var(--badbg); } .chip.mismatch b { color: var(--bad); }
  .chip.unmeasured { border-style: dashed; } .chip.unmeasured b { color: var(--muted); }
  /* UX-EASY2: the optional correction, three toggles per attribute. */
  fieldset.view { border: 1px solid var(--line); border-radius: 10px; margin: 0.5rem 0 0; padding: 0.3rem 0.7rem 0.5rem; display: flex; flex-wrap: wrap; gap: 0.2rem 1rem; }
  fieldset.view legend { font-weight: 600; font-size: 0.9rem; padding: 0 0.3rem; }
  fieldset.view label { font-weight: 400; font-size: 0.88rem; margin: 0; min-height: 44px; display: inline-flex; align-items: center; }
  .correct label { font-weight: 500; font-size: 0.92rem; }
  .correct input[type=text] { margin-top: 0.3rem; }
  ol.wizard { list-style: none; display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.4rem; padding: 0; margin: 0 0 1rem; counter-reset: w; }
  ol.wizard li { counter-increment: w; font-size: 0.85rem; text-align: center; padding: 0.5rem 0.2rem; border-bottom: 4px solid var(--line); color: var(--muted); min-height: 44px; }
  ol.wizard li::before { content: counter(w) ". "; font-weight: 700; }
  ol.wizard li.now { border-color: var(--accent); color: var(--ink); font-weight: 600; }
  ol.wizard li.past { border-color: var(--ok); }
  ol.wizard li.past::before { content: "✓ "; }
  .guide { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 0.8rem 1rem; margin-bottom: 1rem; font-size: 0.92rem; }
  .guide h2 { font-size: 1rem; margin: 0 0 0.4rem; }
  .guide ul { margin: 0 0 0.6rem; padding-left: 1.2rem; }
  .examples { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.4rem; }
  .examples figure { margin: 0; text-align: center; font-size: 0.75rem; }
  .examples svg { width: 100%; height: auto; border-radius: 6px; border: 2px solid var(--line); background: #f1f1ee; }
  .examples .good svg { border-color: var(--ok); } .examples .bad svg { border-color: var(--bad); }
  .examples .good figcaption { color: var(--ok); } .examples .bad figcaption { color: var(--bad); }
  .exif { font-size: 0.85rem; color: var(--ok); background: var(--okbg); border-radius: 8px; padding: 0.4rem 0.7rem; margin-top: 0.6rem; }
  .nav { display: flex; gap: 0.6rem; } .nav button { flex: 1; min-height: 44px; }
  button.secondary { margin-top: 1rem; padding: 0.9rem; font: inherit; background: #fff; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; color: var(--ink); }
  .attrs label { font-weight: 500; font-size: 0.92rem; margin: 0.6rem 0 0.2rem; }
  .summary { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 0.8rem 1rem; font-size: 0.92rem; overflow-wrap: anywhere; }
  .summary .thumbs { margin-top: 0.4rem; }
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; padding: 0.6rem; }
  .compare h3 { font-size: 0.8rem; color: var(--muted); margin: 0 0 0.3rem; font-weight: 600; }
  .compare img { width: 100%; aspect-ratio: 3 / 4; object-fit: contain; background: #eee; border-radius: 8px; }
  .compare .ins { display: grid; gap: 0.3rem; }
  .method { display: inline-block; font-weight: 600; font-size: 0.85rem; border: 1px solid currentColor; border-radius: 999px; padding: 0.15rem 0.6rem; margin-left: 0.4rem; }
  .method.ai-generated { color: var(--warn); background: var(--warnbg); } .method.not-ai { color: var(--ok); background: var(--okbg); } .method.fixture, .method.none { color: var(--muted); background: #eee; }
  .tip { font-size: 0.82rem; color: var(--muted); margin-top: 0.3rem; }
  /* SAMPLE1: the recorded replay is labelled on the card itself, above everything else. */
  .replay { background: var(--warnbg); color: var(--warn); font-weight: 700; padding: 0.7rem 1rem; border-bottom: 1px solid var(--line); }
  .replay .tip { font-weight: 400; color: var(--warn); }
  @media (min-width: 768px) { main { max-width: 48rem; } .compare .ins { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<header>
  <h1 data-t="title"></h1>
  <button type="button" class="lang" id="lang"></button>
</header>
<main>
  <p class="lead" data-t="lead"></p>
  <div id="mode" role="status"></div>

  <ol class="wizard" id="wizard" aria-label="Steps">
    <li data-step="1" data-t="w1"></li>
    <li data-step="2" data-t="w2"></li>
  </ol>

  <form id="form">
    <fieldset id="step1" style="border:0;padding:0;margin:0">
      <div class="drop big" id="drop" tabindex="0" role="button">
        <strong data-t="drop"></strong>
        <span data-t="dropSub"></span>
        <input type="file" id="file" accept="image/jpeg,.jpg,.jpeg" multiple>
      </div>
      <div class="thumbs" id="thumbs"></div>
      <button type="button" class="sample" id="sample" data-t="sample"></button>
      <p class="tip" data-t="sampleNote"></p>
      <label for="note" data-t="noteLabel"></label>
      <input type="text" id="note" maxlength="120" autocomplete="off">
      <div class="error" id="error" role="alert"></div>
      <button type="submit" class="primary" id="start" data-t="start"></button>
      <div class="guide" style="margin-top:1rem">
        <h2 data-t="guideTitle"></h2>
        <ul>
          <li data-t="guide1"></li>
          <li data-t="guide2"></li>
          <li data-t="guide3"></li>
          <li data-t="guide4"></li>
        </ul>
        <!-- Drawn examples, no photos and no people. -->
        <div class="examples">
          <figure class="good"><svg viewBox="0 0 60 80" role="img" aria-labelledby="ex-good"><rect width="60" height="80" fill="#f4f4f1"/><path d="M22 8 L30 12 L38 8 L50 16 L46 30 L42 28 L44 72 L16 72 L18 28 L14 30 L10 16 Z" fill="#c8642a"/></svg><figcaption id="ex-good" data-t="exGood"></figcaption></figure>
          <figure class="bad"><svg viewBox="0 0 60 80" role="img" aria-labelledby="ex-crop"><rect width="60" height="80" fill="#f4f4f1"/><path d="M40 -10 L48 -6 L56 -10 L68 -2 L64 12 L60 10 L62 54 L34 54 L36 10 L32 12 L28 -2 Z" fill="#c8642a"/></svg><figcaption id="ex-crop" data-t="exCrop"></figcaption></figure>
          <figure class="bad"><svg viewBox="0 0 60 80" role="img" aria-labelledby="ex-dark"><rect width="60" height="80" fill="#3a3a38"/><path d="M22 8 L30 12 L38 8 L50 16 L46 30 L42 28 L44 72 L16 72 L18 28 L14 30 L10 16 Z" fill="#5a3018"/><rect x="0" y="0" width="30" height="80" fill="#000" opacity="0.35"/></svg><figcaption id="ex-dark" data-t="exDark"></figcaption></figure>
          <figure class="bad"><svg viewBox="0 0 60 80" role="img" aria-labelledby="ex-busy"><rect width="60" height="80" fill="#9bb07a"/><circle cx="8" cy="10" r="7" fill="#d9a13b"/><rect x="46" y="40" width="14" height="30" fill="#6b4c8a"/><path d="M22 8 L30 12 L38 8 L50 16 L46 30 L42 28 L44 72 L16 72 L18 28 L14 30 L10 16 Z" fill="#c8642a"/><circle cx="52" cy="12" r="6" fill="#3b7fd9"/></svg><figcaption id="ex-busy" data-t="exBusy"></figcaption></figure>
        </div>
      </div>
      <div class="exif" data-t="exifNote"></div>
    </fieldset>
  </form>

  <section id="progress" hidden>
    <ol class="steps" id="steps"></ol>
  </section>

  <section id="result" hidden></section>
</main>
<footer>ProofShot · <span data-t="footer"></span></footer>

      guideTitle: "तस्वीर गाइड",
      guide1: "सामने, पीछे, और डिज़ाइन या लेबल की एक क़रीबी तस्वीर।",
      guide2: "सादी सतह पर बिछाकर या हैंगर पर, पहना हुआ नहीं: तस्वीर में कोई व्यक्ति नहीं।",

      exifNote: "अपलोड पर हर तस्वीर से जगह, कैमरा और तारीख़ (EXIF) हटा दी जाती है, बाकी सब से पहले।",
      attrs: { color: "रंग", print_pattern: "प्रिंट या पैटर्न", logo_text: "लोगो या लिखावट", collar: "कॉलर या गला", sleeve_length: "आस्तीन की लंबाई", hem: "किनारा (हेम)", pocket_count: "जेबें", buttons: "बटन", fabric_texture: "कपड़ा" },
      input: "आपकी तस्वीरें", output: "नतीजा",
      openJudge: "साथ-साथ तुलना, रसीद और पाइपलाइन",
      noImage: "कोई तस्वीर नहीं बनी (कारण देखें)।",
    },
  };
  /** The attribute vocabulary of src/types.ts ATTRIBUTES, in order; test/present.test.ts keeps the two in step. */
  const ATTRS = ["color", "print_pattern", "logo_text", "collar", "sleeve_length", "hem", "pocket_count", "buttons", "fabric_texture"];
  const MAX_PHOTOS = 3;
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  };

  let lang = localStorage.getItem("proofshot-lang") === "hi" ? "hi" : "en";
  const T = () => STRINGS[lang];
  /** The photos chosen, in order: { file, url }. */
  let photos = [];
  let mode = null;
  let current = null; // { job_id, status }
  let replay = null; // SAMPLE1: the recorded run on show, from api/sample/replay
  let timer = null;

  function applyLanguage() {
    document.documentElement.lang = lang;
    for (const node of document.querySelectorAll("[data-t]")) node.textContent = T()[node.dataset.t];
    $("lang").textContent = lang === "en" ? "हिन्दी" : "English";
    $("note").placeholder = T().notePlaceholder;
    paintMode();
    if (current) paintJob(current.status);
    if (replay) paintReplay(replay);
  }

  $("lang").addEventListener("click", () => {
    lang = lang === "en" ? "hi" : "en";
    localStorage.setItem("proofshot-lang", lang);
    applyLanguage();
  });

  // ---- mode ---------------------------------------------------------------
  async function loadMode() {
    try {
      const res = await fetch("api/mode", { cache: "no-store" });
      if (!res.ok) throw new Error(String(res.status));
      mode = await res.json();
    } catch {
      mode = { off: true };
    }
    paintMode();
  }

  function paintMode() {
    const box = $("mode");
    box.replaceChildren();
    box.className = "";
    if (!mode) return;
    if (mode.off) { box.className = "off"; box.textContent = T().modeOff; return; }
    box.className = mode.fixture ? "fixture" : "live";
    box.append(el("span", null, mode.fixture ? T().modeFixture : T().modeLive));
    const details = el("details");
    details.append(el("summary", null, T().modeDetails));
    const dl = el("dl");
    for (const step of ["segment", "render", "verify", "fidelity"]) {
      dl.append(el("dt", null, T().steps[step] || step));
      dl.append(el("dd", null, mode.labels[step]));
    }
    details.append(dl);
    box.append(details);
  }

  // ---- photos --------------------------------------------------------------
  const drop = $("drop");
  const fileInput = $("file");
  drop.addEventListener("click", () => fileInput.click());
  drop.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); fileInput.click(); } });
  for (const type of ["dragenter", "dragover"]) drop.addEventListener(type, (ev) => { ev.preventDefault(); drop.classList.add("over"); });
  for (const type of ["dragleave", "drop"]) drop.addEventListener(type, (ev) => { ev.preventDefault(); drop.classList.remove("over"); });
  drop.addEventListener("drop", (ev) => addFiles(ev.dataTransfer ? ev.dataTransfer.files : []));
  fileInput.addEventListener("change", () => { addFiles(fileInput.files); fileInput.value = ""; });

  function isJpeg(file) {
    return file.type === "image/jpeg" || /\.jpe?g$/i.test(file.name);
  }

  function addFiles(list) {
    setError("");
    for (const file of Array.from(list || [])) {
      if (!isJpeg(file)) { setError(T().errNotJpeg); continue; }
      if (photos.length >= MAX_PHOTOS) { setError(T().errTooMany); break; }
      photos.push({ file, url: URL.createObjectURL(file) });
    }
    paintThumbs();
  }

  function paintThumbs() {
    const box = $("thumbs");
    box.replaceChildren();
    photos.forEach((p, i) => {
      const fig = el("figure");
      const img = el("img");
      img.src = p.url;
      img.alt = p.file.name;
      fig.append(img, el("figcaption", null, p.file.name));
      const rm = el("button", null, "×");
      rm.type = "button";
      rm.title = T().remove;
      rm.setAttribute("aria-label", T().remove);
      rm.addEventListener("click", () => { URL.revokeObjectURL(p.url); photos.splice(i, 1); paintThumbs(); });
      fig.append(rm);
      box.append(fig);
    });
  }

  function setError(text) { $("error").textContent = text; }

  // ---- steps: 1 photos, 2 result (UX-EASY1: nothing to type) -----------------
  function showStep(n) {
    for (const li of $("wizard").children) {
      const i = Number(li.dataset.step);
      li.className = i === n ? "now" : i < n ? "past" : "";
      if (i === n) li.setAttribute("aria-current", "step"); else li.removeAttribute("aria-current");
    }
  }

  // ---- submit --------------------------------------------------------------
  $("form").addEventListener("submit", (ev) => {
    ev.preventDefault();
    start();
  });

  /** Uploads the chosen photos; the type note is optional and is the only text sent. */
  async function start() {
    setError("");
    if (photos.length === 0) return setError(T().errNoPhotos);
    $("start").disabled = true;
    $("sample").disabled = true;
    $("start").textContent = T().running;
    try {
      const files = await Promise.all(photos.map(async (p) => ({ name: safeName(p.file.name), base64: await toBase64(p.file) })));
      const res = await fetch("api/jobs", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ garment_note: $("note").value.trim(), files }) });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || String(res.status));
      current = { job_id: body.job_id, status: null };
      $("form").hidden = true;
      $("progress").hidden = false;
      showStep(2);
      poll();
    } catch (err) {
      setError(err && err.message ? err.message : T().errServer);
      $("start").disabled = false;
      $("sample").disabled = false;
      $("start").textContent = T().start;
    }
  }

  // SAMPLE1: the sample shirt is a recorded run, replayed from its committed receipt.
  // The button never starts a job: no upload, no model, no render; live uploads go through start().
  $("sample").addEventListener("click", async () => {
    setError("");
    $("sample").disabled = true;
    try {
      const res = await fetch("api/sample/replay", { cache: "no-store" });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || String(res.status));
      replay = body;
      paintReplay(replay);
    } catch (err) {
      setError(err && err.message ? err.message : T().errServer);
      $("sample").disabled = false;
    }
  });

  /** The recorded run: label first, then the receipt's own decision, reasons and findings. Nothing here is computed. */
  function paintReplay(view) {
    $("form").hidden = true;
    $("progress").hidden = true;
    showStep(2);
    const box = $("result");
    box.replaceChildren();
    box.hidden = false;
    const card = el("article", "card");
    card.dataset.replay = "recorded";
    const banner = el("div", "replay", T().replayLabel.replace("{date}", view.recorded_on));
    banner.append(el("div", "tip", T().replayNote.replace("{verifier}", view.verifier || "?")));
    card.append(banner);
    const compare = el("div", "compare");
    const left = el("div");
    left.append(el("h3", null, T().input));
    const ins = el("div", "ins");
    for (const s of view.sources) {
      const img = el("img");
      img.src = s.url;
      img.alt = s.label;
      ins.append(img);
    }
    left.append(ins);
    const right = el("div");
    right.append(el("h3", null, T().output));
    if (view.image) {
      const img = el("img");
      img.src = view.image;
      img.alt = view.render_id || "";
      right.append(img);
    } else {
      right.append(el("div", "tip", T().noImage));
    }
    compare.append(left, right);
    card.append(compare);
    const body = el("div", "body");
    const line = el("div");
    body.append(line);
    line.append(el("span", `badge ${view.decision}`, T().badge[view.decision] || view.decision || "?"));
    if (view.badge) {
      const method = el("span", `method ${view.badge.kind}`, view.badge.label);
      method.title = view.badge.tooltip;
      line.append(method);
      body.append(el("div", "tip", view.badge.tooltip));
    }
    const read = el("div");
    body.append(read);
    paintChips(read, view.findings || [], T().readLeadReplay);
    body.append(el("h2", null, T().reasons));
    const ul = el("ul");
    if (view.reasons.length === 0) ul.append(el("li", null, T().noReasons));
    for (const r of view.reasons) ul.append(el("li", null, r));
    body.append(ul);
    const links = el("div", "links");
    if (view.verify) {
      const a = el("a", null, T().verifyOffline);
      a.href = view.verify;
      a.target = "_blank";
      a.rel = "noopener";
      links.append(a);
    }
    const dl = el("a", null, T().downloadReceipt);
    dl.href = view.receipt;
    dl.setAttribute("download", `${view.job_id}-receipt.jsonl`);
    links.append(dl);
    if (view.judge) {
      const judge = el("a", null, T().openJudge);
      judge.href = view.judge;
      links.append(judge);
    }
    body.append(links);
    if (view.image_sha256) body.append(el("div", "hash", `sha256 ${view.image_sha256}`));
    if (view.head) body.append(el("div", "hash", `head ${view.head}`));
    const again = el("button", "again", T().again);
    again.type = "button";
    again.addEventListener("click", reset);
    body.append(again);
    card.append(body);
    box.append(card);
  }

  /** A name the server accepts: letters, digits, dot, dash, underscore, space; ends in .jpg. */
  function safeName(name) {
    const base = name.replace(/\.jpe?g$/i, "").replace(/[^A-Za-z0-9._ -]/g, "-").replace(/^[^A-Za-z0-9]+/, "").slice(0, 60) || "photo";
    return `${base}.jpg`;
  }

  function toBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result).replace(/^data:[^,]*,/, ""));
      reader.onerror = () => reject(reader.error);
      reader.readAsDataURL(file);
    });
  }

  // ---- progress ------------------------------------------------------------
  async function poll() {
    if (!current) return;
    try {
      const res = await fetch(`api/jobs/${encodeURIComponent(current.job_id)}`, { cache: "no-store" });
      if (!res.ok) throw new Error(String(res.status));
      current.status = await res.json();
    } catch {
      current.status = current.status || { steps: [], status: "running" };
    }
    paintJob(current.status);
    if (current.status.status === "running") timer = setTimeout(poll, 400);
  }

  function paintJob(status) {
    if (!status) return;
    const list = $("steps");
    list.replaceChildren();
    for (const step of status.steps || []) {
      const li = el("li", step.state);
      li.append(el("span", "dot"));
      const text = el("div");
      text.append(el("div", "step-name", T().steps[step.name] || step.name));
      text.append(el("div", "step-state", T().states[step.state] || step.state));
      if (step.detail) text.append(el("div", "step-detail", step.detail));
      li.append(text);
      list.append(li);
    }
    if (status.status !== "running") paintResult(status);
  }

  // ---- result card -----------------------------------------------------------
  function paintResult(status) {
    const box = $("result");
    box.replaceChildren();
    box.hidden = false;
    const card = el("article", "card");
    const body = el("div", "body");
    const result = status.result;
    if (status.status === "failed" || !result) {
      body.append(el("span", "badge REFUSE", T().failed));
      body.append(el("h2", null, T().reasons));
      const ul = el("ul");
      ul.append(el("li", null, status.error || "unknown"));
      body.append(ul);
    } else {
      // Input vs result, side by side.
      const compare = el("div", "compare");
      const left = el("div");
      left.append(el("h3", null, T().input));
      const ins = el("div", "ins");
      for (const p of photos) {
        const img = el("img");
        img.src = p.url;
        img.alt = p.file.name;
        ins.append(img);
      }
      left.append(ins);
      const right = el("div");
      right.append(el("h3", null, T().output));
      if (result.image) {
        const img = el("img");
        img.src = result.image;
        img.alt = $("note").value;
        right.append(img);
      } else {
        right.append(el("div", "tip", T().noImage));
      }
      compare.append(left, right);
      card.append(compare);
      const line = el("div");
      body.append(line);
      line.append(el("span", `badge ${result.decision}`, T().badge[result.decision] || result.decision));
      // The render-method badge comes from the job's receipt (render entry), never from the page.
      const method = el("span", "method none");
      method.hidden = true;
      line.append(method);
      const tip = el("div", "tip");
      body.append(tip);
      // UX-EASY1: what the verifier read, one chip per attribute, from the receipt's verifier entry.
      const read = el("div");
      read.hidden = true;
      body.append(read);
      fetch(`api/receipts/${encodeURIComponent(status.job_id)}`, { cache: "no-store" })
        .then((res) => (res.ok ? res.json() : null))
        .then((view) => {
          const r = view && view.renders.find((x) => x.render_id === result.render_id);
          if (!r) return;
          method.className = `method ${r.badge.kind}`;
          method.textContent = r.badge.label;
          method.title = r.badge.tooltip;
          method.hidden = false;
          tip.textContent = r.badge.tooltip;
          paintChips(read, r.findings || []);
          paintCorrection(read, status.job_id);
        })
        .catch(() => {});
      if (status.mode && status.mode.fixture) line.append(el("span", "tag", T().fixtureTag));
      if (status.mode && /^stand-in/.test(status.mode.labels.render) && result.image) line.append(el("span", "tag", T().standIn));
      body.append(el("h2", null, T().reasons));
      const ul = el("ul");
      if (result.reasons.length === 0) ul.append(el("li", null, T().noReasons));
      for (const r of result.reasons) ul.append(el("li", null, r));
      body.append(ul);
      const links = el("div", "links");
      if (result.verify) {
        const a = el("a", null, T().viewReceipt);
        a.href = result.verify;
        a.target = "_blank";
        a.rel = "noopener";
        links.append(a);
      }
      const judge = el("a", null, T().openJudge);
      judge.href = `judge?job=${encodeURIComponent(status.job_id)}`;
      links.append(judge);
      const dl = el("a", null, T().downloadReceipt);
      dl.href = result.receipt;
      dl.setAttribute("download", `${status.job_id}-receipt.jsonl`);
      links.append(dl);
      body.append(links);
      if (result.image_sha256) body.append(el("div", "hash", `sha256 ${result.image_sha256}`));
      body.append(el("div", "hash", `head ${result.head}`));
      // Publish exists only on RELEASE: the server refuses anything else too, this is the only place the button is made.
      if (result.decision === "RELEASE") body.append(publishControl(status));
    }
    const again = el("button", "again", T().again);
    again.type = "button";
    again.addEventListener("click", reset);
    body.append(again);
    card.append(body);
    box.append(card);
  }

  /** One chip per ATTRS entry: match, mismatch, or not measured (uncertain or no finding), with the verifier's note. */
  function paintChips(box, findings, lead) {
    box.replaceChildren();
    box.hidden = false;
    // RV8: in fixture mode no model judged the findings, so the lead says so (as the mode banner does).
    // SAMPLE1: a recorded replay passes its own lead; the server's mode says nothing about that run.
    box.append(el("h2", null, T().readTitle), el("div", "tip", lead || (mode && mode.fixture ? T().readLeadFixture : T().readLead)));
    if (findings.length === 0) { box.append(el("div", "tip", T().noFindings)); return; }
    const chips = el("div", "chips");
    for (const name of ATTRS) {
      const f = findings.find((x) => x.attribute === name);
      const state = f && f.verdict === "match" ? "match" : f && f.verdict === "mismatch" ? "mismatch" : "unmeasured";
      const chip = el("span", `chip ${state}`);
      chip.append(el("b", null, state === "match" ? "✓" : state === "mismatch" ? "✕" : "?"));
      chip.append(document.createTextNode(`${T().attrs[name]}: ${T().chip[state]}`));
      if (f && f.note) chip.append(el("span", "val", f.note));
      chips.append(chip);
    }
    box.append(chips);
  }

  /**
   * UX-EASY2: the optional correction. Saved beside the job (data/corrections),
   * never in the receipt and never read by the gate; the page says so and
   * repaints nothing about the decision.
   */
  function paintCorrection(box, jobId) {
    const wrap = el("div", "correct");
    box.append(wrap);
    const api = `api/jobs/${encodeURIComponent(jobId)}/correction`;
    const showSaved = (records, justSaved) => {
      wrap.replaceChildren();
      const last = records[records.length - 1];
      if (justSaved) wrap.append(el("div", "published", T().correctSaved));
      if (last) {
        wrap.append(el("h2", null, T().correctYours));
        const chips = el("div", "chips");
        for (const name of ATTRS) if (last.attributes[name]) chips.append(el("span", "chip", `${T().attrs[name]}: ${T().views[last.attributes[name]]}`));
        wrap.append(chips);
        if (last.note) wrap.append(el("div", "tip", last.note));
        if (!justSaved) wrap.append(el("div", "tip", T().correctSaved));
      }
      const link = el("button", "again", T().correctLink);
      link.type = "button";
      link.addEventListener("click", () => openForm(records));
      wrap.append(link);
    };
    const openForm = (records) => {
      wrap.replaceChildren();
      const form = el("form");
      form.append(el("h2", null, T().correctLink), el("div", "tip", T().correctLead));
      for (const name of ATTRS) {
        const field = el("fieldset", "view");
        field.append(el("legend", null, T().attrs[name]));
        for (const v of ["matches", "does_not_match", "not_sure"]) {
          const label = el("label");
          const input = el("input");
          input.type = "radio";
          input.name = `c-${name}`;
          input.value = v;
          label.append(input, document.createTextNode(` ${T().views[v]}`));
          field.append(label);
        }
        form.append(field);
      }
      const noteLabel = el("label", null, T().correctNote);
      const note = el("input");
      note.type = "text";
      note.maxLength = 300;
      noteLabel.append(note);
      form.append(noteLabel);
      const err = el("div", "error");
      const save = el("button", "primary", T().correctSave);
      save.type = "submit";
      const cancel = el("button", "again", T().correctCancel);
      cancel.type = "button";
      cancel.addEventListener("click", () => showSaved(records, false));
      form.append(err, save, cancel);
      form.addEventListener("submit", async (ev) => {
        ev.preventDefault();
        const attributes = {};
        for (const name of ATTRS) {
          const picked = form.querySelector(`input[name="c-${name}"]:checked`);
          if (picked) attributes[name] = picked.value;
        }
        save.disabled = true;
        try {
          const res = await fetch(api, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ attributes, note: note.value.trim() }) });
          const body = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(body.error || String(res.status));
          showSaved([...records, body], true);
        } catch (e) {
          save.disabled = false;
          err.textContent = e && e.message ? e.message : T().errServer;
        }
      });
      wrap.append(form);
    };
    fetch(api, { cache: "no-store" })
      .then((res) => (res.ok ? res.json() : null))
      .then((body) => { if (body) showSaved(body.records || [], false); })
      .catch(() => {});
  }

  function publishControl(status) {
    const wrap = el("div");
    if (status.published) {
      const note = el("div", "published", `${T().published} `);
      const a = el("a", null, T().openShop);
      a.href = `shop.html#job=${encodeURIComponent(status.job_id)}&render=${encodeURIComponent(status.result.render_id)}`;
      note.append(a);
      wrap.append(note);
      return wrap;
    }
    const btn = el("button", "primary", T().publish);
    btn.type = "button";
    btn.addEventListener("click", async () => {
      btn.disabled = true;
      try {
        const res = await fetch(`api/jobs/${encodeURIComponent(status.job_id)}/publish`, { method: "POST" });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.error || String(res.status));
        current.status = { ...status, published: body.rows };
        paintResult(current.status);
      } catch (err) {
        btn.disabled = false;
        wrap.append(el("div", "error", err && err.message ? err.message : T().errServer));
      }
    });
    wrap.append(btn);
    return wrap;
  }

  function reset() {
    if (timer) clearTimeout(timer);
    current = null;
    replay = null;
    for (const p of photos) URL.revokeObjectURL(p.url);
    photos = [];
    paintThumbs();
    $("note").value = "";
    showStep(1);
    $("result").hidden = true;
    $("result").replaceChildren();
    $("progress").hidden = true;
    $("form").hidden = false;
    $("start").disabled = false;
    $("sample").disabled = false;
    $("start").textContent = T().start;
  }

  applyLanguage();
  showStep(1);
  loadMode();
})();
</script>
</body>
</html>
